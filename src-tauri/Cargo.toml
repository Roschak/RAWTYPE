[package]
name = "rawtype"
version = "1.0.0"
description = "RAWTYPE — Offline Writing Studio & Personal Knowledge Vault"
authors = ["RAWTYPE Team"]
edition = "2021"

[lib]
name = "rawtype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dirs = "5.0"
hex = "0.4"

